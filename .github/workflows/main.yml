name: Deploy to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm install --include=optional

      - name: Force Install Native Binaries
        run: npm install @tailwindcss/oxide-linux-x64-gnu lightningcss-linux-x64-gnu --no-save

      - name: Build Frontend
        run: npm run build
        env:
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm install

      - name: Build Backend
        run: |
          cd backend
          npm run build

      - name: Prepare Frontend Deployment
        run: |
          mkdir -p dist_frontend
          cp -r .next dist_frontend/
          cp -r public dist_frontend/
          cp package.json dist_frontend/
          cp next.config.ts dist_frontend/
          cp server.js dist_frontend/
          cp -r prisma dist_frontend/ || true

      - name: Deploy Frontend to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./dist_frontend/
          server-dir: ./turantreply.com/

      - name: Prepare Backend Deployment
        run: |
          mkdir -p dist_backend
          cp -r backend/dist dist_backend/
          cp backend/package.json dist_backend/
          cp -r backend/prisma dist_backend/ || true

      - name: Deploy Backend to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./dist_backend/
          server-dir: ./api.turantreply.com/
